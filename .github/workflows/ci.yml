name: Lint CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  RUSTUP_TOOLCHAIN: 1.98.0

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Format, Clippy and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Validate workflow syntax and expressions
        run: |
          GOBIN="$RUNNER_TEMP/actionlint-bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$RUNNER_TEMP/actionlint-bin/actionlint" -color

  contracts:
    name: Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Run regression, hostile-input and real panic checks
        run: |
          mkdir -p target/ci-logs
          bash ci/verify.sh 2>&1 | tee target/ci-logs/contracts.log
      - name: Preserve diagnostic logs on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contracts-${{ matrix.os }}
          path: target/ci-logs/
          if-no-files-found: warn
          retention-days: 7

  mutations:
    name: Tests detect deliberately broken lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Kill targeted semantic, isolation, complexity and panic mutants
        run: python3 ci/mutation_checks.py --output target/ci-mutations
      - name: Preserve mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutation-evidence
          path: target/ci-mutations/
          if-no-files-found: warn
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [quality, contracts, mutations]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail unless every prerequisite passed
        env:
          QUALITY: ${{ needs.quality.result }}
          CONTRACTS: ${{ needs.contracts.result }}
          MUTATIONS: ${{ needs.mutations.result }}
        run: |
          test "$QUALITY" = success
          test "$CONTRACTS" = success
          test "$MUTATIONS" = success
